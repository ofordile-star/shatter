<style>
  :root{
    --bg-deep:#0b0b10;
    --ink:#f5f5f7;
    --ink-dim:rgba(245,245,247,0.5);
    --diagnostic:#6fe3ff;
    --hazard:#ffb020;
    --panel:rgba(255,255,255,0.045);
    --hairline:rgba(255,255,255,0.14);
    --mono:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --sys:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; min-height:100vh; min-height:100dvh;
    background:var(--bg-deep); font-family:var(--sys); color:var(--ink);
  }
  body{
    display:flex; flex-direction:column; align-items:center;
    padding:calc(56px + env(safe-area-inset-top,0px)) 22px calc(40px + env(safe-area-inset-bottom,0px));
    background:
      radial-gradient(ellipse at 50% 0%, rgba(111,227,255,0.10) 0%, rgba(111,227,255,0) 55%),
      linear-gradient(180deg, #1b1330 0%, #0b0b10 40%, #08060b 100%);
    min-height:100vh; min-height:100dvh;
  }
  .brand{
    display:flex; align-items:center; gap:10px; margin-bottom:6px;
  }
  .brand svg{width:26px; height:26px; stroke:var(--ink); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
  .brand h1{
    margin:0; font-family:var(--mono); font-size:15px; letter-spacing:.32em;
    text-transform:uppercase; font-weight:700;
  }
  .tagline{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-dim); margin:0 0 40px; text-align:center;
  }
  .cards{ width:100%; max-width:420px; display:flex; flex-direction:column; gap:14px; }
  a.card{
    display:flex; align-items:center; gap:16px; text-decoration:none; color:var(--ink);
    padding:18px; border-radius:18px; background:var(--panel); border:1px solid var(--hairline);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:background .2s ease, transform .2s ease;
  }
  a.card:active{ background:rgba(255,255,255,0.08); transform:scale(0.985); }
  .card-icon{
    flex:0 0 auto; width:46px; height:46px; border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--diagnostic), #3f8ea8);
  }
  .card-icon svg{ width:22px; height:22px; stroke:var(--bg-deep); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .card-body{ flex:1 1 auto; min-width:0; }
  .card-body h2{ margin:0 0 3px; font-size:15.5px; font-weight:600; }
  .card-body p{ margin:0; font-size:12.5px; line-height:1.4; color:var(--ink-dim); }
  .card-arrow{ flex:0 0 auto; color:var(--ink-dim); font-family:var(--mono); font-size:14px; }

  .card.soon{ opacity:.55; pointer-events:none; }
  .card.soon .card-icon{ background:rgba(255,255,255,0.10); }
  .card.soon .card-icon svg{ stroke:var(--ink-dim); }

  .footer{
    margin-top:46px; text-align:center; font-family:var(--mono); font-size:9.5px;
    letter-spacing:.1em; color:var(--ink-dim); text-transform:uppercase; opacity:.7;
  }
</style>
