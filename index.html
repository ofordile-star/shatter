<style>
  :root{
    --bg-deep:#0b0b10;
    --bg-deep-2:#1b1330;
    --ink:#f5f5f7;
    --ink-dim:rgba(245,245,247,0.5);
    --diagnostic:#6fe3ff;
    --hazard:#ffb020;
    --panel:rgba(12,12,16,0.74);
    --hairline:rgba(255,255,255,0.14);
    --mono:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --sys:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%;
    height:100vh; height:calc(var(--vh, 1vh) * 100); height:100dvh;
    overflow:hidden; background:var(--bg-deep);
    touch-action:none; overscroll-behavior:none;
    font-family:var(--sys); color:var(--ink);
  }
  #stage{
    position:fixed; inset:0; width:100%;
    height:100vh; height:calc(var(--vh, 1vh) * 100); height:100dvh;
  }
  canvas{position:absolute; top:0; left:0; width:100%; height:100%; display:block;}
  #bgCanvas{z-index:1;}
  #crackCanvas{z-index:2;}
  #sheen{
    position:absolute; inset:0; z-index:3; pointer-events:none;
    background:linear-gradient(115deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 70%, rgba(255,255,255,0.05) 100%);
    mix-blend-mode:screen;
  }

  #hint{
    position:absolute; left:50%; bottom:calc(118px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%);
    z-index:4; font-family:var(--mono); font-size:11px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--ink-dim); pointer-events:none;
    transition:opacity .6s ease; white-space:nowrap;
  }
  #hint::before{content:"◆ "; color:var(--diagnostic);}
  #hint.hidden{opacity:0;}

  #toolbar{
    position:absolute; left:50%; bottom:calc(28px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%);
    z-index:5; display:flex; align-items:stretch; gap:1px;
    max-width:calc(100vw - 28px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
    background:var(--panel); backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--hairline); border-radius:16px; overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,0.45);
  }
  .btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; flex:1 1 0; min-width:0; padding:10px 3px 9px; background:transparent; border:none;
    color:var(--ink); cursor:pointer; position:relative;
  }
  .btn:not(:last-child)::after{
    content:""; position:absolute; right:0; top:14%; bottom:14%; width:1px; background:var(--hairline);
  }
  .btn svg{width:18px; height:18px; stroke:var(--ink); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}
  .btn span{
    font-family:var(--mono); font-size:8.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-dim);
  }
  .btn:active{background:rgba(255,255,255,0.06);}
  .btn.warn svg{stroke:var(--hazard);}
  .btn.warn span{color:var(--hazard);}
  .btn.go svg{stroke:var(--diagnostic);}
  .btn.go span{color:var(--diagnostic);}
  .btn:disabled{opacity:.32; pointer-events:none;}

  #fileInput{display:none;}

  #flash{
    position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:20;
  }

  #toast{
    position:absolute; left:50%; top:14px; transform:translateX(-50%) translateY(-140%);
    z-index:10; font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--bg-deep); background:var(--diagnostic); padding:9px 14px; border-radius:10px;
    transition:transform .45s cubic-bezier(.2,.9,.3,1.3); white-space:nowrap;
  }
  #toast.show{transform:translateX(-50%) translateY(0);}

  #sendPrank{
    position:absolute; top:calc(14px + env(safe-area-inset-top, 0px)); right:calc(18px + env(safe-area-inset-right, 0px)); z-index:6;
    display:flex; align-items:center; gap:7px; padding:9px 13px;

  #revealCard{
    position:fixed; inset:0; z-index:30; display:flex; align-items:flex-end; justify-content:center;

  #revealPanel h2{margin:0 0 6px; font-size:20px; font-weight:600;}
  #revealPanel p{margin:0 0 20px; color:var(--ink-dim); font-size:13.5px; line-height:1.5;}
  #revealPanel .row{display:flex; flex-direction:column; gap:10px;}
  .revealBtn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 16px; border-radius:13px; border:none; font-size:13.5px; font-weight:600;
    cursor:pointer; font-family:var(--sys);

  .revealBtn.primary{background:var(--diagnostic); color:var(--bg-deep);}
  .revealBtn.secondary{background:rgba(255,255,255,0.08); color:var(--ink); border:1px solid var(--hairline);}
  #revealPanel .affiliate{
    display:block; margin-top:16px; text-align:center; font-family:var(--mono);
    font-size:10.5px; letter-spacing:.08em; color:var(--ink-dim); text-decoration:none;
  }
  #revealPanel .affiliate b{color:var(--hazard); font-weight:600;}

  #btnStudio{
    position:absolute; left:calc(14px + env(safe-area-inset-left, 0px)); bottom:calc(28px + env(safe-area-inset-bottom, 0px));

  }
  #btnStudio svg{width:16px; height:16px; stroke:var(--ink); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}
  #btnStudio:active{opacity:1; background:rgba(255,255,255,0.08);}

<script>
(() => {
  const bgCanvas = document.getElementById('bgCanvas');
  const crackCanvas = document.getElementById('crackCanvas');
  const bgCtx = bgCanvas.getContext('2d');
  const crCtx = crackCanvas.getContext('2d');
  const hint = document.getElementById('hint');
  const toast = document.getElementById('toast');
  const flash = document.getElementById('flash');
  const btnUndo = document.getElementById('btnUndo');
  const btnReset = document.getElementById('btnReset');
  const btnSave = document.getElementById('btnSave');
  const btnUpload = document.getElementById('btnUpload');
  const btnIcons = document.getElementById('btnIcons');
  const btnShake = document.getElementById('btnShake');
  const fileInput = document.getElementById('fileInput');
  const sendPrankBtn = document.getElementById('sendPrank');
  const revealCard = document.getElementById('revealCard');
  const revealSend = document.getElementById('revealSend');
  const revealMake = document.getElementById('revealMake');
  const affiliateLink = document.getElementById('affiliateLink');
  const btnStudio = document.getElementById('btnStudio');

  // Swap this for your real Amazon Associates (or other affiliate) link
  // once you're signed up — this is the only line that needs editing.
  const AFFILIATE_TAG = 'shatter00-20';
  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const searchTerm = isIOS ? 'ailun tempered glass screen protector' : 'tempered glass screen protector android';
  // ascsubtag segments clicks by which app sent them, inside the same
  // Associates account/tag — no second signup needed, shows up as a
  // breakdown in Associates Central reporting.
  const AFFILIATE_URL = 'https://www.amazon.com/s?k=' + encodeURIComponent(searchTerm) + '&tag=' + AFFILIATE_TAG + '&ascsubtag=shatter-classic';
  affiliateLink.href = AFFILIATE_URL;

  // Best-effort, no-signup hit counter (countapi.xyz) so you can see whether
  // the prank link is actually getting forwarded. Not authoritative — just a
  // free directional signal. Fails silently if the service is unreachable.
  function trackHit(key){
    try{
      fetch(`https://api.countapi.xyz/hit/shatter-app-ofordile/${key}`).catch(()=>{});
    }catch(e){}
  }

  let dpr = Math.min(window.devicePixelRatio || 1, 3);
  let W = 0, H = 0;
  let wallpaperImg = null; // user-uploaded image, cover-fit
  let cracks = []; // history of {x,y,seed}
  let showIcons = false;
  let shakeEnabled = false;
  let tipShown = false;

  function setVH(){
    // window.innerHeight already excludes the browser's address bar on mobile,
    // unlike raw 100vh which is based on the largest possible viewport.
    document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
  }

  function resize(){
    setVH();
    W = window.innerWidth; H = window.innerHeight;
    [bgCanvas, crackCanvas].forEach(c => {
      c.width = W * dpr; c.height = H * dpr;
      c.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    });
    drawBackground();
    redrawCracks();
  }

  // ---------- background (fake lock screen) ----------
  function drawBackground(){
    bgCtx.clearRect(0,0,W,H);
    if (wallpaperImg){
      drawCover(bgCtx, wallpaperImg, W, H);
      // slight darken so overlay text stays legible
      bgCtx.fillStyle = 'rgba(0,0,0,0.28)';
      bgCtx.fillRect(0,0,W,H);
    } else {
      const g = bgCtx.createLinearGradient(0,0,W,H);
      g.addColorStop(0, '#1b1330');
      g.addColorStop(0.55, '#0b0b10');
      g.addColorStop(1, '#08060b');
      bgCtx.fillStyle = g;
      bgCtx.fillRect(0,0,W,H);
      // soft ambient glow
      const rg = bgCtx.createRadialGradient(W*0.5,H*0.32,0,W*0.5,H*0.32,H*0.6);
      rg.addColorStop(0,'rgba(111,227,255,0.10)');
      rg.addColorStop(1,'rgba(111,227,255,0)');
      bgCtx.fillStyle = rg;
      bgCtx.fillRect(0,0,W,H);
    }
    drawStatusBar();
    drawClock();
    if (showIcons) drawIconGrid();
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function shade(hex, amt){
    const num = parseInt(hex.slice(1),16);
    let r=(num>>16)+amt, g=((num>>8)&0xff)+amt, b=(num&0xff)+amt;
    r=Math.min(255,Math.max(0,r)); g=Math.min(255,Math.max(0,g)); b=Math.min(255,Math.max(0,b));
    return `rgb(${r},${g},${b})`;
  }

  const APP_ICON_COLORS = ['#6fe3ff','#ffb020','#ff6b81','#7c5cff','#33d17a','#ffd166','#4dd0e1','#f78fb3','#a0e57c','#c792ea','#ff9f68','#5ac8fa'];

  function drawAppIcon(x,y,size,color,label){
    roundRect(bgCtx, x, y, size, size, size*0.24);
    const grad = bgCtx.createLinearGradient(x,y,x+size,y+size);
    grad.addColorStop(0, color);
    grad.addColorStop(1, shade(color,-30));
    bgCtx.fillStyle = grad;
    bgCtx.fill();
    bgCtx.strokeStyle = 'rgba(255,255,255,0.85)';
    bgCtx.lineWidth = size*0.05;
    bgCtx.beginPath();
    bgCtx.arc(x+size/2, y+size/2, size*0.16, 0, Math.PI*2);
    bgCtx.stroke();
    if (label){
      const sysFont = getComputedStyle(document.documentElement).getPropertyValue('--sys');
      bgCtx.fillStyle = 'rgba(245,245,247,0.88)';
      bgCtx.font = `500 ${Math.max(9,size*0.17)}px ${sysFont}`;
      bgCtx.textAlign = 'center';
      bgCtx.shadowColor = 'rgba(0,0,0,0.45)'; bgCtx.shadowBlur = 4;
      bgCtx.fillText(label, x+size/2, y+size+size*0.26);
      bgCtx.shadowBlur = 0;
    }
  }

  // Stylized generic home-screen mock — abstract icons only, no real app
  // branding — so an uploaded photo reads as an actual home screen layout.
  function drawIconGrid(){
    const cols = 4, rows = 3;
    const marginX = W*0.09;
    const usableW = W - marginX*2;
    const iconSize = Math.min(usableW/cols*0.6, 60);
    const gapX = (usableW - cols*iconSize) / (cols-1);
    const startY = H*0.40;
    const rowGap = iconSize*1.6;
    const apps = ['Notes','Mail','Photos','Camera','Weather','Music','Maps','Calendar','Clock','Files','Browser','Health'];

    apps.forEach((name, idx) => {
      const col = idx % cols, row = Math.floor(idx/cols);
      if (row >= rows) return;
      const x = marginX + col*(iconSize+gapX);
      const y = startY + row*rowGap;
      drawAppIcon(x, y, iconSize, APP_ICON_COLORS[idx % APP_ICON_COLORS.length], name);
    });

    // dock
    const dockApps = ['Phone','Msg','Cam','Web'];
    const dockY = H - Math.max(158, H*0.17);
    const dockGap = (usableW - dockApps.length*iconSize) / (dockApps.length-1);
    roundRect(bgCtx, marginX-10, dockY-12, usableW+20, iconSize+24, 22);
    bgCtx.fillStyle = 'rgba(255,255,255,0.10)';
    bgCtx.fill();
    dockApps.forEach((name, idx) => {
      const x = marginX + idx*(iconSize+dockGap);
      drawAppIcon(x, dockY, iconSize, APP_ICON_COLORS[(idx+6) % APP_ICON_COLORS.length], null);
    });
  }

  function drawCover(ctx, img, w, h){
    const ir = img.width / img.height, cr = w / h;
    let sw, sh, sx, sy;
    if (ir > cr){ sh = img.height; sw = sh*cr; sy=0; sx=(img.width-sw)/2; }
    else { sw = img.width; sh = sw/cr; sx=0; sy=(img.height-sh)/2; }
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  }

  function drawStatusBar(){
    const y = Math.max(18, H*0.028);
    bgCtx.save();
    bgCtx.fillStyle = 'rgba(245,245,247,0.7)';
    // signal dots
    for(let i=0;i<4;i++){
      const bh = 4 + i*2.4;
      bgCtx.fillRect(18 + i*5, y - bh, 3, bh);
    }
    // battery pill
    const bx = W-40, by = y-8;
    bgCtx.strokeStyle = 'rgba(245,245,247,0.7)';
    bgCtx.lineWidth = 1.4;
    bgCtx.strokeRect(bx, by, 24, 10);
    bgCtx.fillRect(bx+25, by+2.5, 2, 5);
    bgCtx.fillRect(bx+2, by+2, 16, 6);
    bgCtx.restore();
  }

  function drawClock(){
    const now = new Date();
    const h = now.getHours(), m = now.getMinutes();
    const hh = ((h % 12) || 12);
    const timeStr = `${hh}:${String(m).padStart(2,'0')}`;
    const dateStr = now.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });

    bgCtx.textAlign = 'center';
    bgCtx.fillStyle = 'rgba(245,245,247,0.96)';
    bgCtx.font = `300 ${Math.min(W*0.19,92)}px ${getComputedStyle(document.documentElement).getPropertyValue('--sys')}`;
    bgCtx.shadowColor = 'rgba(0,0,0,0.35)';
    bgCtx.shadowBlur = 18;
    bgCtx.fillText(timeStr, W/2, H*0.235);

    bgCtx.font = `500 ${Math.min(W*0.042,17)}px ${getComputedStyle(document.documentElement).getPropertyValue('--sys')}`;
    bgCtx.fillStyle = 'rgba(245,245,247,0.72)';
    bgCtx.shadowBlur = 10;
    bgCtx.fillText(dateStr, W/2, H*0.235 + 34);
    bgCtx.shadowBlur = 0;
  }

  setInterval(drawBackground, 15000);

  // ---------- crack rendering ----------
  function rand(a,b){ return a + Math.random()*(b-a); }

  function drawImpactBurst(ctx, x, y, power){
    ctx.save();
    const rg = ctx.createRadialGradient(x,y,0,x,y,power*0.9);
    rg.addColorStop(0,'rgba(255,255,255,0.30)');
    rg.addColorStop(0.4,'rgba(255,255,255,0.10)');
    rg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(x,y,power*0.9,0,Math.PI*2); ctx.fill();

    // small central shard cluster
    const shards = Math.floor(rand(7,11));
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for(let i=0;i<shards;i++){
      const a1 = rand(0,Math.PI*2), a2=a1+rand(0.2,0.6);
      const r1 = rand(3,9), r2 = rand(6,14);
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x+Math.cos(a1)*r2, y+Math.sin(a1)*r2);
      ctx.lineTo(x+Math.cos(a2)*r1, y+Math.sin(a2)*r1);
      ctx.closePath();
      ctx.globalAlpha = rand(0.08,0.22);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // Fixed light source (upper-left) used for every crack so the whole screen
  // reads as one consistent 3D surface rather than each crack lit differently.
  const LIGHT = { x: -0.72, y: -0.7 };

  // ---------- animation scheduler ----------
  // Segments are computed synchronously (deterministic, seeded) but their
  // actual draw calls are deferred through here so a crack visibly
  // propagates outward instead of appearing all at once.
  let animQueue = [];
  let animRunning = false;
  function scheduleDraw(delayMs, fn){
    animQueue.push({ t: performance.now() + delayMs, fn });
    if (!animRunning){ animRunning = true; requestAnimationFrame(animTick); }
  }
  function animTick(now){
    if (animQueue.length){
      const ready = [];
      animQueue = animQueue.filter(item => {
        if (item.t <= now){ ready.push(item.fn); return false; }
        return true;
      });
      ready.forEach(fn => fn());
    }
    if (animQueue.length) requestAnimationFrame(animTick);
    else animRunning = false;
  }

  function strokePts(ctx, pts, color, width){
    if (pts.length < 2) return;
    ctx.beginPath();
    pts.forEach((p,i)=> i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(0.35, width);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.stroke();
  }

  function buildCrackSegments(out, x, y, angle, length, baseWidth, jitter=0.34){
    if (length < 8) return;
    const segments = Math.floor(rand(5,9));
    const segLen = length / segments;
    let cx = x, cy = y, ca = angle;
    for(let i=0;i<segments;i++){
      const px = cx, py = cy;
      ca += rand(-jitter, jitter);
      cx += Math.cos(ca)*segLen;
      cy += Math.sin(ca)*segLen;
      const t = i / Math.max(1, segments-1);
      const w = Math.max(0.45, baseWidth * (1 - t*0.72)); // tapers thinner toward the tip
      out.push({x0:px, y0:py, x1:cx, y1:cy, w});
    }
  }

  function drawBeveledSegment(ctx, x0, y0, x1, y1, w){
    let dx = x1-x0, dy = y1-y0;
    const len = Math.hypot(dx,dy) || 1;
    dx/=len; dy/=len;
    const nx = -dy, ny = dx;
    const facingLight = (nx*LIGHT.x + ny*LIGHT.y) > 0;
    const litN = facingLight ? {x:nx,y:ny} : {x:-nx,y:-ny};
    const off = w*0.9 + 0.4;
    const p0 = {x:x0,y:y0}, p1 = {x:x1,y:y1};
    const lit0 = {x:x0+litN.x*off, y:y0+litN.y*off}, lit1 = {x:x1+litN.x*off, y:y1+litN.y*off};
    const sh0 = {x:x0-litN.x*off, y:y0-litN.y*off}, sh1 = {x:x1-litN.x*off, y:y1-litN.y*off};

    strokePts(ctx, [sh0,sh1], 'rgba(0,0,0,0.42)', w+0.8);    // recessed dark edge
    strokePts(ctx, [p0,p1], 'rgba(0,0,0,0.22)', w*1.4);       // groove body
    strokePts(ctx, [lit0,lit1], 'rgba(255,255,255,0.8)', w*0.65); // lit bevel edge
    strokePts(ctx, [p0,p1], 'rgba(255,255,255,0.32)', w*0.28);    // glassy center glint
  }

  function distToEdge(x, y, angle, w, h){
    const dx = Math.cos(angle), dy = Math.sin(angle);
    let t = Infinity;
    if (dx > 0.0001) t = Math.min(t, (w - x) / dx);
    else if (dx < -0.0001) t = Math.min(t, (0 - x) / dx);
    if (dy > 0.0001) t = Math.min(t, (h - y) / dy);
    else if (dy < -0.0001) t = Math.min(t, (0 - y) / dy);
    return Math.max(20, t);
  }

  function buildRings(out, x, y, maxR, count){
    for(let i=0;i<count;i++){
      const r = rand(maxR*0.25, maxR*0.85);
      const a0 = rand(0,Math.PI*2);
      const span = rand(1.2,3.4);
      let a = a0;
      const pts = [];
      while(a < a0+span){
        const jr = r + rand(-4,4);
        pts.push({x: x+Math.cos(a)*jr, y: y+Math.sin(a)*jr});
        a += rand(0.12,0.24);
      }
      out.push({ pts, color: `rgba(255,255,255,${rand(0.18,0.4)})`, width: rand(0.6,1.3) });
    }
  }
  function drawRingStroke(ctx, ring){
    strokePts(ctx, ring.pts, ring.color, ring.width);
  }

  function renderCrack(ctx, x, y, seed, animate){
    // seed drives deterministic re-render on resize/undo
    let s = seed;
    const srand = () => { s = (s*9301+49297)%233280; return s/233280; };
    const origRandom = Math.random;
    Math.random = srand;

    const power = rand(70, 150);
    drawImpactBurst(ctx, x, y, power); // instant flash regardless of animate

    const spokes = Math.floor(rand(4,7));
    const edgeIdx = Math.floor(rand(0, spokes));
    const edgeSegs = [];
    const spokeSegGroups = [];
    for(let i=0;i<spokes;i++){
      const a = (Math.PI*2*i/spokes) + rand(-0.22,0.22);
      if (i === edgeIdx){
        // one crack runs edge-to-edge straight through the impact point,
        // rather than stopping at the tap location — this is closer to how
        // real screens actually fracture.
        const reachOut = distToEdge(x, y, a, W, H) * 1.08;
        const reachBack = distToEdge(x, y, a + Math.PI, W, H) * 1.08;
        buildCrackSegments(edgeSegs, x, y, a, reachOut, 2.1, 0.1);
        buildCrackSegments(edgeSegs, x, y, a + Math.PI, reachBack, 2.1, 0.1);
      } else {
        const segs = [];
        buildCrackSegments(segs, x, y, a, power*rand(1.0,1.8), 1.8);
        spokeSegGroups.push(segs);
      }
    }
    const rings = [];
    buildRings(rings, x, y, power*1.3, Math.floor(rand(1,3)));

    Math.random = origRandom;

    if (!animate){
      edgeSegs.forEach(sg => drawBeveledSegment(ctx, sg.x0, sg.y0, sg.x1, sg.y1, sg.w));
      spokeSegGroups.forEach(segs => segs.forEach(sg => drawBeveledSegment(ctx, sg.x0, sg.y0, sg.x1, sg.y1, sg.w)));
      rings.forEach(r => drawRingStroke(ctx, r));
      return;
    }

    // Animate: the edge-to-edge crack races out first (fastest, straightest),
    // the other spokes fan out with a slight independent stagger each, and
    // the connecting rings settle in last — roughly how a real shatter cascades.
    const STEP = 15;
    edgeSegs.forEach((sg,i) => scheduleDraw(i*STEP, () => drawBeveledSegment(ctx, sg.x0, sg.y0, sg.x1, sg.y1, sg.w)));
    let maxEnd = edgeSegs.length*STEP;
    spokeSegGroups.forEach(segs => {
      const startOffset = rand(0,30);
      segs.forEach((sg,i) => scheduleDraw(startOffset + i*STEP, () => drawBeveledSegment(ctx, sg.x0, sg.y0, sg.x1, sg.y1, sg.w)));
      maxEnd = Math.max(maxEnd, startOffset + segs.length*STEP);
    });
    rings.forEach((r,i) => scheduleDraw(maxEnd + 20 + i*25, () => drawRingStroke(ctx, r)));
  }

  function redrawCracks(){
    crCtx.clearRect(0,0,W,H);
    cracks.forEach(c => renderCrack(crCtx, c.x, c.y, c.seed, false));
  }

  // ---------- audio + haptics ----------
  let actx;
  function playCrack(){
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const dur = 0.16;
      const buf = actx.createBuffer(1, actx.sampleRate*dur, actx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length, 2.2);
      const src = actx.createBufferSource(); src.buffer = buf;
      const filt = actx.createBiquadFilter();
      filt.type='bandpass'; filt.frequency.value = rand(2200,5200); filt.Q.value=0.7;
      const gain = actx.createGain(); gain.gain.value = 0.5;
      src.connect(filt); filt.connect(gain); gain.connect(actx.destination);
      src.start();
    }catch(e){}
  }
  function haptic(){ if (navigator.vibrate) navigator.vibrate(14); }

  // ---------- interaction ----------
  function crackAt(x,y){
    const seed = Math.floor(rand(1,99999));
    cracks.push({x,y,seed});
    renderCrack(crCtx, x, y, seed, true);
    playCrack(); haptic();
    hint.classList.add('hidden');
    btnUndo.disabled = false;
    btnReset.disabled = false;
  }

  crackCanvas.addEventListener('pointerdown', (e) => {
    if (e.target.closest('#toolbar')) return;
    crackAt(e.clientX, e.clientY);
  });

  btnUndo.addEventListener('click', () => {
    cracks.pop();
    redrawCracks();
    if (!cracks.length){ btnUndo.disabled=true; btnReset.disabled=true; hint.classList.remove('hidden'); }
  });

  btnReset.addEventListener('click', () => {
    cracks = [];
    crCtx.clearRect(0,0,W,H);
    btnUndo.disabled = true; btnReset.disabled = true;
    hint.classList.remove('hidden');
  });

  btnUpload.addEventListener('click', () => {
    if (wallpaperImg){
      // second tap: remove photo, revert to default background
      wallpaperImg = null;
      btnUpload.classList.remove('go');
      drawBackground();
      showToast('Photo removed');
      return;
    }
    if (!tipShown){
      tipShown = true;
      showToast('Tip: screenshot your real home screen first', 2600);
    }
    fileInput.click();
  });
  fileInput.addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const img = new Image();
    img.onload = () => { wallpaperImg = img; btnUpload.classList.add('go'); drawBackground(); showToast('Wallpaper set'); };
    img.src = URL.createObjectURL(f);
  });

  btnIcons.addEventListener('click', () => {
    showIcons = !showIcons;
    btnIcons.classList.toggle('go', showIcons);
    drawBackground();
  });

  // ---------- shake-to-crack ----------
  let lastShakeTime = 0;
  let lastAcc = {x:0,y:0,z:0};
  function onDeviceMotion(e){
    const acc = e.accelerationIncludingGravity || e.acceleration;
    if (!acc) return;
    const now = Date.now();
    if (now - lastShakeTime < 700) return; // debounce so one shake = one crack
    const dx = (acc.x||0)-lastAcc.x, dy = (acc.y||0)-lastAcc.y, dz = (acc.z||0)-lastAcc.z;
    lastAcc = {x:acc.x||0, y:acc.y||0, z:acc.z||0};
    const delta = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if (delta > 28){
      lastShakeTime = now;
      crackAt(W/2 + rand(-W*0.15,W*0.15), H/2 + rand(-H*0.15,H*0.15));
    }
  }
  function enableShake(){
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
      DeviceMotionEvent.requestPermission().then(state => {
        if (state === 'granted'){
          window.addEventListener('devicemotion', onDeviceMotion);
          shakeEnabled = true; btnShake.classList.add('go');
          showToast('Shake enabled');
        } else showToast('Motion permission denied');
      }).catch(() => showToast('Motion permission denied'));
    } else if ('DeviceMotionEvent' in window){
      window.addEventListener('devicemotion', onDeviceMotion);
      shakeEnabled = true; btnShake.classList.add('go');
      showToast('Shake enabled');
    } else {
      showToast('Shake not supported here');
    }
  }
  btnShake.addEventListener('click', () => {
    if (shakeEnabled){
      window.removeEventListener('devicemotion', onDeviceMotion);
      shakeEnabled = false; btnShake.classList.remove('go');
      showToast('Shake disabled');
    } else {
      enableShake();
    }
  });

  btnSave.addEventListener('click', () => {
    const out = document.createElement('canvas');
    out.width = bgCanvas.width; out.height = bgCanvas.height;
    const octx = out.getContext('2d');
    octx.drawImage(bgCanvas,0,0);
    octx.drawImage(crackCanvas,0,0);
    flash.style.transition='none'; flash.style.opacity='0.9';
    requestAnimationFrame(()=>{
      flash.style.transition='opacity .4s ease';
      flash.style.opacity='0';
    });
    out.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'shattered.png';
      document.body.appendChild(a); a.click(); a.remove();
      showToast('Image saved');
    });
  });

  // ---------- prank link: send ----------
  function prankUrl(){
    const u = new URL(location.href);
    u.search = '';
    u.searchParams.set('p', '1');
    return u.toString();
  }

  async function sharePrank(){
    const url = prankUrl();
    const text = "Uh... is your screen okay?";
    trackHit('prank-sent');
    if (navigator.share){
      try{ await navigator.share({ text, url }); return; }catch(e){ /* user cancelled, fall through */ }
    }
    try{
      await navigator.clipboard.writeText(url);
      showToast('Prank link copied — send it to someone', 2400);
    }catch(e){
      showToast(url, 4000);
    }
  }
  sendPrankBtn.addEventListener('click', sharePrank);
  revealSend.addEventListener('click', sharePrank);
  revealMake.addEventListener('click', () => { location.href = location.pathname; });

  // ---------- prank link: receive ----------
  function runPrankSequence(){
    trackHit('prank-opened');
    hint.classList.add('hidden');
    document.getElementById('toolbar').style.display = 'none';
    sendPrankBtn.style.display = 'none';
    btnStudio.style.display = 'none';
    const delay = rand(1400, 3800);
    setTimeout(() => {
      crackAt(W/2 + rand(-W*0.18,W*0.18), H*0.5 + rand(-H*0.12,H*0.12));
      setTimeout(() => revealCard.classList.add('show'), 1300);
    }, delay);
  }

  if (new URLSearchParams(location.search).get('p') === '1'){
    runPrankSequence();
  } else {
    trackHit('visit');
  }

  let toastTimer;
  function showToast(msg, duration=1600){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove('show'), duration);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 300));
  resize();
})();
</script>
</body>
</html>
